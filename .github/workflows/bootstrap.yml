name: ICY bootstrap loop (Phase 0)

# Boucle la plus nue possible, zero LLM : un declenchement (telephone ou
# CLI) ecrit un fichier et ouvre une PR. C'est tout le critere de fin de
# Phase 0 du GUIDE_ATELIER.md -- rien de plus n'est ajoute ici.

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Message libre a inscrire dans le fichier de preuve"
        required: false
        default: "test manuel"
  repository_dispatch:
    types: [icy_bootstrap_test]

permissions:
  contents: write
  pull-requests: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Le PAT (pas le GITHUB_TOKEN par defaut) est utilise ici expres :
      # GitHub n'enchaine jamais un workflow sur un evenement pull_request
      # produit par le GITHUB_TOKEN par defaut (protection anti-boucle
      # native, verifiee en conditions reelles -- voir TODO_MANUEL.md #4).
      # Avec le PAT, la PR ouverte redevient capable de declencher verify.yml.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ICY_PAT }}

      - name: Ecrire la preuve et ouvrir la PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.ICY_PAT }}
          MESSAGE: ${{ github.event.inputs.message || github.event.client_payload.message || 'repository_dispatch' }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git config user.name "icy-bootstrap"
          git config user.email "icy-bootstrap@users.noreply.github.com"

          STAMP=$(date -u +%Y%m%d-%H%M%S)
          BRANCH="boot-${STAMP}"
          FILE="bootstrap/ping-${STAMP}.md"

          git checkout -b "$BRANCH"
          mkdir -p bootstrap
          cat > "$FILE" <<EOF
          # Preuve de boucle -- ${STAMP}

          - Declencheur : ${TRIGGER}
          - Message     : ${MESSAGE}
          - Commit run  : ${GITHUB_RUN_ID}
          EOF

          git add "$FILE"
          git commit -m "boot: preuve de boucle ${STAMP}"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "ICY bootstrap: preuve de boucle ${STAMP}" \
            --body "Ouverte automatiquement par le workflow bootstrap (declencheur: ${TRIGGER}). Valide le critere de fin de Phase 0 du GUIDE_ATELIER.md : un declenchement ecrit un fichier et ouvre une PR." \
            --base main \
            --head "$BRANCH")

          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
          echo "message=${MESSAGE}" >> "$GITHUB_OUTPUT"

      - name: Notifier sur Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          MESSAGE: ${{ steps.pr.outputs.message }}
        run: |
          set -euo pipefail
          TEXT="ICY -- boucle terminee.
          Declenchement : ${MESSAGE}
          PR : ${PR_URL}"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}"
