<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ICY — Console</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0b0e13" />
<style>
  :root {
    --bg: #0b0e13;
    --surface: #12161f;
    --border: #232938;
    --text: #e7ebf3;
    --muted: #8791a6;
    --accent: #5ee6c2;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  header .brand { font-weight: 700; letter-spacing: 0.02em; }
  header .brand small { color: var(--muted); font-weight: 400; display: block; font-size: 12px; }
  #stop {
    background: transparent;
    border: 1px solid var(--danger);
    color: var(--danger);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 600;
  }
  main {
    flex: 1;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 560px;
    margin: 0 auto;
    width: 100%;
  }
  textarea {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    min-height: 90px;
    resize: vertical;
    font-family: inherit;
  }
  textarea:focus, input:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  button.primary {
    background: var(--accent);
    color: #06110d;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    font-weight: 700;
  }
  button.primary:disabled { opacity: 0.5; }
  #status {
    font-size: 14px;
    color: var(--muted);
    min-height: 1.4em;
  }
  #status.ok { color: var(--accent); }
  #status.err { color: var(--danger); }
  .timeline {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .timeline .item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    color: var(--muted);
  }
  .timeline .item a { color: var(--accent); }
  details {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .cfg-row { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .cfg-row input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
  }
</style>
</head>
<body>
  <header>
    <div class="brand">ICY<small>Console — Phase 1</small></div>
    <button id="stop" title="Rien en cours d'execution cote client a interrompre en Phase 1 -- ce bouton devient reel des la Phase 2 (missions vivantes)">STOP</button>
  </header>
  <main>
    <textarea id="message" placeholder="Objectif ou instruction... (ex: cree un fichier test.md)"></textarea>
    <button id="send" class="primary">Envoyer</button>
    <div id="status"></div>

    <div id="timeline" class="timeline"></div>

    <details>
      <summary>Configuration du gateway</summary>
      <div class="cfg-row">
        <input id="cfg-url" placeholder="URL du gateway (ex: https://icy-gateway.xxx.workers.dev)" />
        <input id="cfg-secret" type="password" placeholder="Secret partage (x-icy-secret)" />
        <button id="cfg-save" class="primary">Enregistrer</button>
      </div>
    </details>
  </main>
  <script src="app.js"></script>
</body>
</html>
